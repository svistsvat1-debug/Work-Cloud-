<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Edge Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Unbounded:wght@600;700&display=swap">
<style>
/* Layout: sticky terminal-style header + one filter row that scopes a tabbed workspace of panels.
   Color: trading-terminal black with a green tint, green = up/profit/action, red = down/loss. Mono face for figures. */
:root {
  color-scheme: dark;
  --bg: #040605;
  --surface: #0a0e0c;
  --surface-2: #0f1512;
  --raise: #152019;
  --line: #18221c;
  --line-2: #24312a;
  --fg: #e4f1e8;
  --fg-2: #9bb1a2;
  --muted: #768b7d;
  --accent: #19e27c;
  --accent-ink: #011a0b;
  --accent-text: #3cf093;
  --accent-wash: rgba(25, 226, 124, .12);
  --profit: #23e081;
  --loss: #ff4d5e;
  --profit-wash: rgba(35, 224, 129, .13);
  --loss-wash: rgba(255, 77, 94, .13);
  --hl-band: rgba(228, 241, 232, .08);
  --focus: #3cf093;
  --overlay: rgba(0, 0, 0, .74);
  --shadow: 0 16px 44px rgba(0, 0, 0, .65);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --s5: #d55181; --s6: #2f9a2f; --s7: #9085e9; --s8: #e66767;
  --font-ui: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --font-display: "Unbounded", "Onest", system-ui, sans-serif;
  --r: 10px;
  --r-sm: 6px;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #eef3f0; --surface: #ffffff; --surface-2: #f4f8f5; --raise: #e7eee9;
    --line: #dbe5de; --line-2: #c6d3ca;
    --fg: #07120b; --fg-2: #415246; --muted: #5d7064;
    --accent: #14c466; --accent-ink: #011a0b; --accent-text: #08743c; --accent-wash: rgba(20, 196, 102, .14);
    --profit: #0b7d39; --loss: #d12a3c; --profit-wash: rgba(11, 125, 57, .10); --loss-wash: rgba(209, 42, 60, .09);
    --hl-band: rgba(7, 18, 11, .07);
    --focus: #08743c; --overlay: rgba(7, 18, 11, .45); --shadow: 0 14px 40px rgba(7, 18, 11, .16);
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
    --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #eef3f0; --surface: #ffffff; --surface-2: #f4f8f5; --raise: #e7eee9;
  --line: #dbe5de; --line-2: #c6d3ca;
  --fg: #07120b; --fg-2: #415246; --muted: #5d7064;
  --accent: #14c466; --accent-ink: #011a0b; --accent-text: #08743c; --accent-wash: rgba(20, 196, 102, .14);
  --profit: #0b7d39; --loss: #d12a3c; --profit-wash: rgba(11, 125, 57, .10); --loss-wash: rgba(209, 42, 60, .09);
  --hl-band: rgba(7, 18, 11, .07);
  --focus: #08743c; --overlay: rgba(7, 18, 11, .45); --shadow: 0 14px 40px rgba(7, 18, 11, .16);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--font-ui); -webkit-font-smoothing: antialiased; }
body.modal-open { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
img { max-width: 100%; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-mono); }
.pos { color: var(--profit); }
.neg { color: var(--loss); }
.muted { color: var(--muted); }
.grow { flex: 1 1 auto; }
.wrap { max-width: 1240px; margin-inline: auto; padding-inline: 16px; }
@media (min-width: 900px) { .wrap { padding-inline: 24px; } }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; gap: 12px; padding-block: 12px 6px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand .mark { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; flex: none; }
.brand .mark svg { width: 18px; height: 18px; }
.word { font-family: var(--font-display); font-weight: 700; font-size: 16px; letter-spacing: -.01em; white-space: nowrap; }
.word b { color: var(--accent-text); font-weight: 700; }
.store-chip { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--fg-2); border: 1px solid var(--line-2); border-radius: 999px; padding: 3px 10px 3px 9px; white-space: nowrap; cursor: default; }
.store-chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: none; }
.store-chip.cloud i { background: var(--profit); }
.store-chip.warn i, .store-chip.demo i { background: var(--accent); }
.top-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { appearance: none; background: none; border: 0; padding: 10px 12px 11px; color: var(--fg-2); font-weight: 500; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
.tab:hover { color: var(--fg); }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
@media (max-width: 600px) { .store-chip span { display: none; } .btn-new-label { display: none; } .word { font-size: 14px; } }

.demo-bar { background: var(--accent-wash); border-bottom: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line)); }
.demo-bar .wrap { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding-block: 8px; font-size: 13px; }
.demo-short { display: none; }
@media (max-width: 600px) { .demo-long { display: none; } .demo-short { display: inline; } .demo-bar .wrap { flex-wrap: nowrap; gap: 8px; } }

/* buttons */
.btn { appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: var(--r-sm); border: 1px solid var(--line-2); background: var(--surface-2); color: var(--fg); font-weight: 500; cursor: pointer; white-space: nowrap; text-decoration: none; }
.btn:hover { background: var(--raise); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.07); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--fg-2); }
.btn.ghost:hover { background: var(--surface-2); color: var(--fg); }
.btn.danger { color: var(--loss); border-color: color-mix(in srgb, var(--loss) 45%, var(--line-2)); background: transparent; }
.btn.danger.solid { background: var(--loss); color: #fff; border-color: var(--loss); }
.btn.sm { height: 30px; padding: 0 10px; font-size: 13px; }
.btn[disabled] { opacity: .55; cursor: default; }
.btn svg, .icon-btn svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.icon-btn { appearance: none; width: 36px; height: 36px; display: grid; place-items: center; border-radius: var(--r-sm); border: 1px solid var(--line-2); background: var(--surface-2); color: var(--fg-2); cursor: pointer; flex: none; }
.icon-btn:hover { color: var(--fg); background: var(--raise); }
.kbd { font-family: var(--font-mono); font-size: 12px; border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 5px; padding: 0 6px; background: var(--surface-2); color: var(--fg); white-space: nowrap; }

/* filters */
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding-block: 14px; }
.filters select, .filters input, .inp { height: 34px; border: 1px solid var(--line-2); background: var(--surface); color: var(--fg); border-radius: var(--r-sm); padding: 0 10px; min-width: 0; max-width: 100%; }
.filters input[type="search"] { width: 220px; flex: 1 1 220px; max-width: 360px; }
.filters input[type="date"] { width: 150px; }
.f-custom { display: inline-flex; gap: 6px; align-items: center; }
.f-more { display: contents; }
.f-toggle { display: none; }
@media (max-width: 720px) {
  .filters:not(.open) .f-more { display: none; }
  .f-toggle { display: inline-flex; }
  .filters select { flex: 1 1 140px; }
  .filters input[type="search"] { flex: 1 1 100%; width: auto; max-width: none; }
  .f-custom { flex: 1 1 100%; }
  .f-custom input { flex: 1 1 0; width: auto; }
}

/* layout */
.view { display: grid; gap: 16px; padding-bottom: 56px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.panel h3 { margin: 0 0 14px; font-size: 12px; font-weight: 600; color: var(--fg-2); letter-spacing: .06em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; min-height: 24px; }
.panel h3 .aside { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 500; font-size: 12px; color: var(--muted); }
.panel h3 .btn.aside { color: var(--fg-2); }
.g2 { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 980px) { .g2 { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); } .g2.even { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }

/* hero + tiles */
.hero { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 980px) { .hero { grid-template-columns: minmax(250px, .85fr) minmax(0, 2fr); align-items: stretch; } }
.hero-main { display: flex; flex-direction: column; gap: 4px; justify-content: center; padding: 4px 4px 4px 2px; }
.lbl { font-size: 12px; color: var(--fg-2); }
.hero-num { font-size: 48px; line-height: 1.05; font-weight: 700; letter-spacing: -.02em; margin: 4px 0 6px; overflow-wrap: anywhere; }
.hero-main .sub { color: var(--fg-2); font-size: 13px; }
.tiles { display: grid; gap: 1px; grid-template-columns: repeat(2, minmax(0, 1fr)); background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
@media (min-width: 700px) { .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.tile { background: var(--surface); padding: 12px 14px; min-width: 0; }
.tile .val { font-size: 20px; font-weight: 600; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .sub { font-size: 12px; color: var(--muted); margin-top: 2px; overflow-wrap: anywhere; }

/* compare cards */
.cmp { display: flex; flex-wrap: wrap; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.cmp > div { background: var(--surface); padding: 12px 14px; display: grid; gap: 2px; flex: 1 1 150px; min-width: 0; }
.cmp .big { font-size: 20px; font-weight: 600; }
.cmp .sub { font-size: 12px; color: var(--muted); }

/* tables */
.tbl-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { font-weight: 500; color: var(--muted); text-align: right; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; font-size: 12px; }
.tbl th:first-child, .tbl td:first-child { text-align: left; padding-left: 0; }
.tbl th:last-child, .tbl td:last-child { padding-right: 0; }
.tbl td { padding: 10px; border-bottom: 1px solid var(--line); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl tbody tr:last-child td { border-bottom: 0; }
.tbl tr.click { cursor: pointer; }
.tbl tr.click:hover td { background: var(--surface-2); }
.tbl th.sort { cursor: pointer; user-select: none; }
.tbl th.sort:hover, .tbl th[aria-sort] { color: var(--fg); }
.tbl .wr { display: inline-grid; gap: 3px; justify-items: end; }
.meter { width: 64px; height: 4px; border-radius: 2px; background: var(--line-2); position: relative; }
.meter i { position: absolute; inset: 0 auto 0 0; background: var(--fg-2); border-radius: 2px; }
.meter b { position: absolute; top: -3px; height: 10px; width: 2px; margin-left: -1px; background: var(--fg); border-radius: 1px; }

/* strategy chip, tags */
.schip { display: inline-flex; align-items: center; gap: 7px; min-width: 0; max-width: 100%; }
.schip i { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.schip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dir { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; border: 1px solid; }
.dir.up { color: var(--profit); border-color: color-mix(in srgb, var(--profit) 40%, transparent); }
.dir.down { color: var(--loss); border-color: color-mix(in srgb, var(--loss) 40%, transparent); }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line-2); color: var(--fg-2); white-space: nowrap; }
.tag.m { border-color: color-mix(in srgb, var(--loss) 40%, var(--line-2)); background: var(--loss-wash); color: var(--fg); }
.tag.ok { border-color: color-mix(in srgb, var(--profit) 40%, var(--line-2)); background: var(--profit-wash); color: var(--fg); }
.tag.demo { border-color: color-mix(in srgb, var(--accent) 50%, var(--line-2)); background: var(--accent-wash); color: var(--fg); font-size: 11px; padding: 0 6px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }

/* trade list */
.tlist { display: grid; }
.trow { display: grid; grid-template-columns: 60px 86px minmax(150px, 1.3fr) minmax(110px, 1fr) 136px 96px 96px; gap: 12px; align-items: center; padding: 9px 6px; border-bottom: 1px solid var(--line); cursor: pointer; border-radius: 6px; }
.trow:last-child { border-bottom: 0; }
.trow.head { cursor: default; color: var(--muted); font-size: 12px; padding-block: 4px 8px; border-radius: 0; }
.trow:not(.head):hover { background: var(--surface-2); }
.trow .c-r, .trow .c-res { text-align: right; font-variant-numeric: tabular-nums; }
.trow .c-res { font-weight: 600; }
.trow .c-date small { display: block; color: var(--muted); font-size: 12px; }
.trow .c-sym { display: flex; align-items: center; gap: 8px; min-width: 0; flex-wrap: wrap; }
.trow .sym { font-family: var(--font-mono); font-weight: 600; }
.trow .c-flags { display: flex; gap: 4px; justify-content: flex-end; flex-wrap: wrap; }
.trow .c-meta { display: none; }
.trow.compact { grid-template-columns: 60px minmax(0, 1fr) auto; }
.trow.compact .c-date, .trow.compact .c-strat, .trow.compact .c-flags, .trow.compact .c-r { display: none; }
.trow.compact .c-meta { display: block; grid-column: 2; grid-row: 2; }
.trow.compact .c-th { grid-row: span 2; }
.trow.compact .c-res { grid-row: span 2; }
.thumb { width: 60px; height: 38px; border-radius: 6px; background: var(--surface-2); overflow: hidden; display: grid; place-items: center; border: 1px solid var(--line); color: var(--muted); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; }
.c-meta { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (max-width: 760px) {
  .trow.head { display: none; }
  .trow { grid-template-columns: 60px minmax(0, 1fr) auto; row-gap: 2px; column-gap: 12px; }
  .trow .c-date, .trow .c-strat, .trow .c-flags { display: none; }
  .trow .c-th { grid-row: span 2; }
  .trow .c-sym { grid-column: 2; grid-row: 1; }
  .trow .c-res { grid-column: 3; grid-row: 1; }
  .trow .c-meta { display: block; grid-column: 2; grid-row: 2; }
  .trow .c-r { grid-column: 3; grid-row: 2; font-size: 12px; color: var(--muted); }
}
.list-head { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-bottom: 8px; }
.list-head .count { font-weight: 600; }
.hint { font-size: 13px; color: var(--fg-2); }

/* charts */
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; height: 100%; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font-ui); font-variant-numeric: tabular-nums; }
.chart .endlab { fill: var(--fg); font-weight: 600; font-size: 12px; }
.gridl { stroke: var(--line); stroke-width: 1; }
.zerol { stroke: var(--line-2); stroke-width: 1; }
.eq-line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.eq-area { fill: var(--accent); opacity: .1; }
.dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.xh { stroke: var(--fg-2); stroke-width: 1; }
.col-p { fill: var(--profit); }
.col-n { fill: var(--loss); }
.hit { fill: transparent; cursor: default; }
.hit:hover + .hl, .hl.on { fill: var(--fg); opacity: .06; }
.spark { display: block; }
.spark polyline { fill: none; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }

/* horizontal diverging bars */
.bars { display: grid; gap: 10px; }
.bar-row { display: grid; grid-template-columns: minmax(90px, 170px) minmax(0, 1fr) minmax(92px, auto); gap: 12px; align-items: center; font-size: 13px; }
.bar-row .lab { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-row .lab small { color: var(--muted); margin-left: 4px; }
.bar-track { position: relative; height: 14px; }
.bar-track .zero { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--line-2); }
.bar-track .b { position: absolute; top: 2px; height: 10px; min-width: 2px; }
.bar-track .b.p { background: var(--profit); border-radius: 0 4px 4px 0; }
.bar-track .b.n { background: var(--loss); border-radius: 4px 0 0 4px; }
.bar-row .val { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
@media (max-width: 520px) { .bar-row { grid-template-columns: minmax(0, 1fr) minmax(84px, auto); } .bar-row .bar-track { grid-column: 1 / -1; grid-row: 2; } }

/* insights */
.ins { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.ins li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; line-height: 1.5; }
.ins .ic { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font-size: 12px; font-weight: 700; }
.ins .good .ic { background: var(--profit-wash); color: var(--profit); }
.ins .bad .ic { background: var(--loss-wash); color: var(--loss); }
.ins .info .ic { background: var(--accent-wash); color: var(--accent-text); }

/* calendar */
.cal-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-bottom: 12px; }
.cal-head h2 { margin: 0; font-size: 18px; font-weight: 600; min-width: 150px; }
.cal-sum { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--fg-2); }
.cal-sum b { color: var(--fg); }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)) minmax(0, 1.05fr); gap: 4px; }
.cal .wd { font-size: 12px; color: var(--muted); padding: 2px 6px; }
.cal .day, .cal .wk { min-height: 80px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); padding: 6px 8px; display: flex; flex-direction: column; gap: 1px; min-width: 0; text-align: left; font: inherit; color: inherit; appearance: none; }
.cal .day.has { cursor: pointer; }
.cal .day.has:hover { border-color: var(--line-2); }
.cal .day .d { font-size: 12px; color: var(--muted); }
.cal .day .v, .cal .wk .v { font-weight: 600; font-size: 13px; margin-top: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-variant-numeric: tabular-nums; }
.cal .day .n, .cal .wk .n { font-size: 11px; color: var(--fg-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cal .day.out { visibility: hidden; }
.cal .vs { display: none; }
.cal .day.today { border-color: var(--accent); }
.cal .wk { background: transparent; border-style: dashed; }
@media (max-width: 680px) {
  .cal { grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
  .cal .wk, .cal .wkh { display: none; }
  .cal .day { min-height: 54px; padding: 4px 5px; }
  .cal .day .n { display: none; }
  .cal .day .v { font-size: 11px; letter-spacing: -.02em; }
  .cal .vl { display: none; }
  .cal .vs { display: inline; }
}

/* empty states */

function insightsHTML(list, st) {
  const closed = list.filter(isClosed);
  if (closed.length < 5) return `<p class="muted">Висновки з'являться, коли у вибірці буде хоча б 5 закритих угод.</p>`;
  const out = [];
  if (st.beWR != null && st.winRate != null) {
    const gap = esc(pp(Math.abs(st.edge)).replace(/^[+\u2212]/, ''));
    const tail = st.edge >= 0 ? (st.net < 0 ? `Ти вище на ${gap}, але в мінусі через різні ставки: програші були більшими за виграші.` : `Ти вище на ${gap}`) : `Не вистачає ${gap}`;
    out.push([st.edge >= 0 && st.net >= 0 ? 'good' : 'bad', st.edge >= 0 && st.net >= 0 ? '▲' : '▼', `Вінрейт ${esc(pct(st.winRate))} при середній виплаті ${esc(payoutFmt(round2(st.avgPayout)))}. Щоб бути в плюсі, потрібно від ${esc(pct(st.beWR))}. ${tail}`]);
  }
  const g = groupStats(closed, t => t.strategy || 'Без стратегії').filter(r => r.st.n >= 3);
  if (g.length >= 2) {
    const best = g.reduce((a, b) => b.st.net > a.st.net ? b : a), worst = g.reduce((a, b) => b.st.net < a.st.net ? b : a);
    if (best.st.net > 0) out.push(['good', '▲', `Найприбутковіша стратегія — <b>${esc(best.key)}</b>: ${esc(money(best.st.net))} за ${nTradesAcc(best.st.n)}, вінрейт ${esc(pct(best.st.winRate))}.`]);
    if (worst.st.net < 0) out.push(['bad', '▼', `<b>${esc(worst.key)}</b> у мінусі: ${esc(money(worst.st.net))} за ${nTradesAcc(worst.st.n)}, вінрейт ${esc(pct(worst.st.winRate))}.`]);
  }
  const ex = groupStats(closed.filter(t => t.expiry), t => t.expiry).filter(r => r.st.n >= 3);
  if (ex.length >= 2) {
    const b = ex.reduce((a, c) => c.st.net > a.st.net ? c : a);
    if (b.st.net > 0) out.push(['info', '●', `Найкраща експірація — <b>${esc(b.key)}</b>: ${esc(money(b.st.net))}, вінрейт ${esc(pct(b.st.winRate))}.`]);
  }
  const yes = stats(closed.filter(t => t.followedPlan === true)), no = stats(closed.filter(t => t.followedPlan === false));
  if (yes.n >= 2 && no.n >= 2) out.push([no.exp < yes.exp ? 'bad' : 'info', '!', `Не за планом: вінрейт ${esc(pct(no.winRate))} і ${esc(money(no.net))} за ${nTradesAcc(no.n)}. За планом: ${esc(pct(yes.winRate))} і ${esc(money(yes.net))}.`]);
  const chase = chaseTrades(closed);
  if (chase.length >= 2) { const cs = stats(chase); out.push([cs.net < 0 ? 'bad' : 'info', '!', `Після мінуса ти ${chase.length} ${plural(chase.length, 'раз', 'рази', 'разів')} піднімав ставку. Ці угоди дали ${esc(money(cs.net))}, вінрейт ${esc(pct(cs.winRate))}.`]); }
  const mk = groupStats(closed.filter(t => t.mistakes.length), t => t.mistakes).filter(r => r.st.net < 0).sort((a, b) => a.st.net - b.st.net)[0];
  if (mk) out.push(['bad', '▼', `Найдорожча помилка — <b>${esc(mk.key)}</b>: ${esc(money(mk.st.net))} у ${mk.st.n} ${plural(mk.st.n, 'угоді', 'угодах', 'угодах')}.`]);
  const hr = groupStats(closed.filter(t => t.time), t => +t.time.slice(0, 2)).filter(r => r.st.n >= 3);
  if (hr.length >= 3) {
    const b = hr.reduce((a, c) => c.st.net > a.st.net ? c : a), w = hr.reduce((a, c) => c.st.net < a.st.net ? c : a);
    if (b.st.net > 0 && w.st.net < 0) out.push(['info', '●', `Найкраща година входу — ${pad(b.key)}:00 (${esc(money(b.st.net))}), найгірша — ${pad(w.key)}:00 (${esc(money(w.st.net))}).`]);
  }
  const lossP = closed.filter(t => t.result === 'loss' && t.pips != null), near = lossP.filter(t => t.pips <= 1);
  if (near.length >= 3) out.push(['info', '●', `${near.length} з ${lossP.length} мінусів програні на 1 пункт або менше (${esc(money(stats(near).net))}). Варто перевірити момент входу.`]);
  if (st.cur && st.cur.type === 'loss' && st.cur.n >= 3) out.push(['bad', '!', `Зараз ${st.cur.n} мінуси поспіль. Зроби паузу, не відігравайся.`]);
  if (!out.length) out.push(['info', '●', 'Явних перекосів поки немає. Заповнюй стратегії, помилки й дотримання плану, щоб з’явились порівняння.']);
  return `<ul class="ins">${out.map(([k, ic, h]) => `<li class="${k}"><span class="ic" aria-hidden="true">${ic}</span><span>${h}</span></li>`).join('')}</ul>`;
}

function calendarHTML(list) {
  const closed = list.filter(isClosed);

    const d = days.get(t.date) || { net: 0, n: 0, w: 0, l: 0 };
    d.net += tradeNet(t); d.n++;
    if (t.result === 'win') d.w++; else if (t.result === 'loss') d.l++;
    days.set(t.date, d);
  }
  const vals = [...days.values()];
  const maxAbs = Math.max(1e-9, ...vals.map(d => Math.abs(d.net)));
  const monthNet = vals.reduce((a, d) => a + d.net, 0);
  const green = vals.filter(d => d.net > 0).length, red = vals.filter(d => d.net < 0).length;
  const bestDay = [...days].sort((a, b) => b[1].net - a[1].net)[0], worstDay = [...days].sort((a, b) => a[1].net - b[1].net)[0];
  const first = new Date(y, m - 1, 1), offset = (first.getDay() + 6) % 7, dim = new Date(y, m, 0).getDate();
  const weeks = Math.ceil((offset + dim) / 7), today = todayStr();
  let cells = WD.map(w => `<div class="wd">${w}</div>`).join('') + '<div class="wd wkh">Тиждень</div>';
  for (let w = 0; w < weeks; w++) {
    const wk = { net: 0, n: 0 };

/* ---------- analytics tab ---------- */
function cmpCard(label, list) {
  const st = stats(list);
  return `<div><span class="lbl">${esc(label)}</span><span class="big num ${cls(st.net)}">${st.n ? esc(money(st.net)) : '—'}</span><span class="sub">${nTrades(st.n)} · вінрейт ${esc(pct(st.winRate))}</span><span class="sub">середня угода ${esc(money(st.exp))}</span></div>`;
}
function groupTable(rows, firstLabel) {
  if (!rows.length) return '<p class="muted">Немає даних.</p>';
  return `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>${esc(firstLabel)}</th><th>Угод</th><th>Вінрейт</th><th>Net</th><th>Сер.</th></tr></thead><tbody>${rows.map(r => `
    <tr><td>${r.labelHTML || esc(r.key)}</td><td>${r.st.n}</td><td>${esc(pct(r.st.winRate))}</td><td class="${cls(r.st.net)}">${esc(money(r.st.net))}</td><td class="${cls(r.st.exp)}">${esc(money(r.st.exp))}</td></tr>`).join('')}</tbody></table></div>`;
}
function expiryOrder(a) { return expirySeconds(a) ?? 1e9; }
function pipsPanel(closed) {
  const withP = closed.filter(t => t.pips != null && t.result !== 'draw');
  if (!withP.length) return `<section class="panel"><h3>Рух у пунктах</h3><p class="muted" style="margin:0">Вказуй у формі угоди, на скільки пунктів пройшла ціна, щоб бачити, на скільки ти виграєш і програєш.</p></section>`;
  const wins = withP.filter(t => t.result === 'win'), losses = withP.filter(t => t.result === 'loss'), near = losses.filter(t => t.pips <= 1);
  const bySym = groupStats(withP, t => t.symbol).map(r => ({ key: r.key, n: r.list.length, w: avgOf(r.list.filter(t => t.result === 'win').map(t => t.pips)), l: avgOf(r.list.filter(t => t.result === 'loss').map(t => -t.pips)) })).sort((a, b) => b.n - a.n);
  return `<section class="panel"><h3>Рух у пунктах<span class="aside">від входу до експірації</span></h3>
    <div class="cmp">
      <div><span class="lbl">Плюсові угоди</span><span class="big num pos">${esc(pipsFmt(avgOf(wins.map(signedPips))))}</span><span class="sub">у середньому · ${nTrades(wins.length)}</span></div>
      <div><span class="lbl">Мінусові угоди</span><span class="big num neg">${esc(pipsFmt(avgOf(losses.map(signedPips))))}</span><span class="sub">у середньому · ${nTrades(losses.length)}</span></div>
      <div><span class="lbl">Мінус на 1 пункт і менше</span><span class="big num ${near.length ? 'neg' : ''}">${near.length}</span><span class="sub">${near.length ? `${esc(money(stats(near).net))} · ${esc(pct(near.length / losses.length))} усіх мінусів` : 'таких немає'}</span></div>
    </div>
    ${bySym.length > 1 ? `<div class="tbl-wrap" style="margin-top:12px"><table class="tbl"><thead><tr><th>Актив</th><th>Угод з рухом</th><th>Сер. рух у плюсі</th><th>Сер. рух у мінусі</th></tr></thead><tbody>${bySym.map(r => `<tr><td>${esc(r.key)}</td><td>${r.n}</td><td class="pos">${esc(pipsFmt(r.w))}</td><td class="neg">${esc(pipsFmt(r.l))}</td></tr>`).join('')}</tbody></table></div>` : ''}
  </section>`;
}
function analyticsHTML(list) {
  const closed = list.filter(isClosed);
  if (!closed.length) return noResultsHTML();
  const withM = closed.filter(t => t.mistakes.length);
  const mk = groupStats(withM, t => t.mistakes).sort((a, b) => a.st.net - b.st.net);
  const wd = WD.map((label, i) => { const st = stats(closed.filter(t => weekdayIdx(t.date) === i)); return { label, full: WD_FULL[i], value: st.net, n: st.n, wr: st.winRate }; });
  const timed = closed.filter(t => t.time);
  let hrs = Array.from({ length: 24 }, (_, h) => { const st = stats(timed.filter(t => +t.time.slice(0, 2) === h)); return { label: String(h), full: `${pad(h)}:00–${pad(h)}:59`, value: st.net, n: st.n, wr: st.winRate }; });
  const used = hrs.map((h, i) => h.n ? i : -1).filter(i => i >= 0);
  if (used.length) hrs = hrs.slice(Math.max(0, Math.min(...used) - 1), Math.min(24, Math.max(...used) + 2));

    <section class="panel"><h3>Вгору vs Вниз</h3><div class="cmp">${cmpCard('↑ Вгору', closed.filter(t => t.direction === 'up'))}${cmpCard('↓ Вниз', closed.filter(t => t.direction === 'down'))}</div></section>
  </div>
  ${pipsPanel(closed)}
  <section class="panel"><h3>Ціна помилок<span class="aside">чистий результат угод, де була помилка</span></h3>
    ${mk.length ? divBars(mk.map(r => ({ label: r.key, value: r.st.net, note: `× ${r.st.n}`, tip: `${nTrades(r.st.n)} · вінрейт ${pct(r.st.winRate)}` }))) : '<p class="muted">Помилок не відмічено. Відмічай їх у формі угоди, щоб бачити, скільки вони коштують.</p>'}
    <div class="cmp" style="margin-top:16px">${cmpCard('Угоди без помилок', closed.filter(t => !t.mistakes.length))}${cmpCard('Угоди з помилками', withM)}${chase.length ? cmpCard('Підняв ставку після мінуса', chase) : ''}</div>
  </section>
  <div class="g2 even">
    <section class="panel"><h3>Дні тижня<span class="aside">чистий результат</span></h3>${chart('cols', wd, 220)}</section>
    <section class="panel"><h3>Година входу<span class="aside">чистий результат</span></h3>${timed.length ? chart('cols', hrs, 220) : '<p class="muted">Вказуй час входу, щоб бачити найкращі години.</p>'}</section>
  </div>
  <div class="g2 even">
    <section class="panel"><h3>Активи</h3>${groupTable(sym, 'Актив')}</section>
    <section class="panel"><h3>Експірація</h3>${exp.length ? groupTable(exp, 'Експірація') : '<p class="muted">Експірація ще не вказана.</p>'}</section>
  </div>
  <div class="g2 even">
    <section class="panel"><h3>Емоції</h3>${emo.length ? groupTable(emo, 'Емоція') : '<p class="muted">Емоції ще не відмічені.</p>'}</section>
    <section class="panel"><h3>Розмір ставки</h3>${stakes.length ? groupTable(stakes, 'Ставка') : '<p class="muted">Ставки ще не вказані.</p>'}</section>
  </div>`;
}

/* ---------- modal system ---------- */
function modal(html, opts = {}) {
  closeModal(true);
  const back = document.createElement('div');
  back.className = 'mback';
  back.innerHTML = `<div class="modal ${opts.cls || ''}" role="dialog" aria-modal="true" aria-label="${esc(opts.label || '')}">${html}</div>`;
  document.body.append(back);
  document.body.classList.add('modal-open');
  let downOnBack = false;
  back.addEventListener('pointerdown', e => { downOnBack = e.target === back; });
  back.addEventListener('click', e => {
    if ((e.target === back && downOnBack && !opts.guard) || e.target.closest('[data-close]')) tryClose();
  });
  S.modal = { el: back, type: opts.type || '', guard: opts.guard || null, addFiles: null, cleanup: [] };
  hideTip();
  return back.firstElementChild;
}
function closeModal(silent = false) {
  if (!S.modal) return;
  const m = S.modal;
  S.modal = null;
  for (const f of m.cleanup) { try { f(); } catch { /* chart already gone */ } }
  m.el.remove();
  document.body.classList.remove('modal-open');
  if (!silent && S.staleView) { S.staleView = false; render(); }
}
/* Live updates from another device re-render now, or right after the open dialog closes. */
function refreshSoon() { if (S.demo) return; if (S.modal) S.staleView = true; else render(); }
function tryClose() {
  if (!S.modal) return;
  if (S.modal.guard && S.modal.guard()) return;
  closeModal();
}

/* ---------- trade chart from 1-minute quotes ---------- */
let chartLibP = null;
function loadChartLib() {
  if (window.LightweightCharts) return Promise.resolve(window.LightweightCharts);
  if (!chartLibP) chartLibP = new Promise((res, rej) => {
    const sc = document.createElement('script');
    sc.src = '/vendor/lightweight-charts.standalone.production.js';

    sc.onerror = () => { chartLibP = null; rej(new Error('не вдалося завантажити бібліотеку графіків')); };
    document.head.append(sc);

}
async function loadQuoteChart(box, t) {
  const owner = S.modal;

    const [LC, q] = await Promise.all([loadChartLib(), quoteMove(t)]);
    if (!box.isConnected || S.modal !== owner) return;
    if (!q || !q.candles.length) { box.innerHTML = '<div class="qwait">Котирувань за цей час немає: вихідний, свято або пара не торгувалась.</div>'; return; }
    box.innerHTML = '<div class="holder"></div><div class="qmeta"></div>';
    const css = getComputedStyle(document.documentElement), tok = n => css.getPropertyValue(n).trim();
    const shift = tzOffset(q.w.start, cfg().tz) / 1000;
    const T = ms => Math.floor(ms / 1000) + shift;
    const jpy = q.pair.includes('JPY'), digits = jpy ? 3 : 5;

      rightPriceScale: { borderColor: tok('--line-2') },
      timeScale: { borderColor: tok('--line-2'), timeVisible: true, secondsVisible: false },
    });
    owner.cleanup.push(() => chart.remove());
    const band = chart.addSeries(LC.HistogramSeries, { priceScaleId: 'band', color: tok('--hl-band'), priceLineVisible: false, lastValueVisible: false });
    chart.priceScale('band').applyOptions({ scaleMargins: { top: 0, bottom: 0 }, visible: false });
    band.setData(q.candles.map(c => ({ time: T(c.t), value: c.t + 60e3 > q.w.start && c.t < q.w.end ? 1 : 0 })));
    const cs = chart.addSeries(LC.CandlestickSeries, { upColor: tok('--profit'), downColor: tok('--loss'), wickUpColor: tok('--profit'), wickDownColor: tok('--loss'), borderVisible: false, priceFormat: { type: 'price', precision: digits, minMove: Math.pow(10, -digits) } });
    cs.setData(q.candles.map(c => ({ time: T(c.t), open: c.o, high: c.h, low: c.l, close: c.c })));
    if (q.entry != null) cs.createPriceLine({ price: q.entry, color: tok('--fg-2'), lineWidth: 1, lineStyle: LC.LineStyle.Dashed, axisLabelVisible: true, title: 'вхід' });
    const near = ts => q.candles.reduce((best, c) => Math.abs(c.t - ts) < Math.abs(best.t - ts) ? c : best, q.candles[0]);
    const up = t.direction !== 'down';
    LC.createSeriesMarkers(cs, [
      { time: T(near(q.w.start).t), position: up ? 'belowBar' : 'aboveBar', color: up ? tok('--profit') : tok('--loss'), shape: up ? 'arrowUp' : 'arrowDown', text: 'вхід ' + t.time },
      { time: T(near(q.w.end).t), position: up ? 'aboveBar' : 'belowBar', color: tok('--accent-text'), shape: 'circle', text: 'експірація ' + (closeTime(t.time, t.expiry) || '') },
    ].sort((a, b) => a.time - b.time));
    chart.timeScale().fitContent();
    const agree = q.pips == null || t.result === 'open' || t.result === 'draw' ? null : (q.pips > 0) === (t.result === 'win');
    const parts = [`<span>${esc(q.source)}, хвилинні свічки</span>`];
    if (q.pips != null) {
      parts.push(`<span>вхід <b>${q.entry.toFixed(digits)}</b> → експірація <b>${q.exit.toFixed(digits)}</b></span>`, `<span>рух <b>${esc(pipsFmt(q.pips))}</b> ${q.pips > 0 ? 'у твій бік' : q.pips < 0 ? 'проти' : ''}</span>`);
      if (agree === false) parts.push(`<span class="neg">У брокера «${RES[t.result]}»: його котирування відрізнялись від ринкових.</span>`);

    } else parts.push('<span>Немає ціни на момент входу або експірації.</span>');
    $('.qmeta', box).innerHTML = parts.join('');
  } catch (e) {
    if (box.isConnected) box.innerHTML = `<div class="qwait">Графік недоступний: ${esc(errText(e))}</div>`;
  }
}

/* ---------- lightbox ---------- */
function lightbox(items, start = 0) {
  if (!items.length) return;
  const lb = document.createElement('div');
  lb.className = 'lb';
  lb.setAttribute('role', 'dialog');
  lb.setAttribute('aria-label', 'Перегляд скріну');
  lb.innerHTML = `<div class="lb-bar"><span class="lb-c"></span><span class="grow"></span>${items.length > 1 ? `<button type="button" data-a="prev" aria-label="Попередній">${I.left}</button><button type="button" data-a="next" aria-label="Наступний">${I.right}</button>` : ''}<button type="button" data-a="zoom" aria-label="Масштаб 100%">${I.zoom}</button><button type="button" data-a="close" aria-label="Закрити">${I.x}</button></div><div class="lb-stage"><img alt="Скріншот угоди"></div>`;
  document.body.append(lb);
  const img = $('img', lb), stage = $('.lb-stage', lb), counter = $('.lb-c', lb);
  let i = start;
  const show = async () => {
    stage.classList.remove('zoom');
    img.removeAttribute('src');
    const it = items[i];
    counter.textContent = items.length > 1 ? `${i + 1} / ${items.length}` : '';
    try { img.src = typeof it === 'string' ? await imgURL(it) : it.url; } catch { /* broken image */ }
  };
  const close = () => { lb.remove(); S.lb = null; };
  const step = d => { i = (i + d + items.length) % items.length; show(); };
  S.lb = { close, step };
  lb.addEventListener('click', e => {
    const a = e.target.closest('[data-a]');
    if (a) { const k = a.dataset.a; if (k === 'close') close(); else if (k === 'prev') step(-1); else if (k === 'next') step(1); else stage.classList.toggle('zoom'); return; }
    if (e.target === img) stage.classList.toggle('zoom');
    else if (e.target === stage) close();
  });
  let sx = null;
  stage.addEventListener('pointerdown', e => { sx = stage.classList.contains('zoom') ? null : e.clientX; });
  stage.addEventListener('pointerup', e => { if (sx != null && Math.abs(e.clientX - sx) > 60 && items.length > 1) step(e.clientX < sx ? 1 : -1); sx = null; });
  show();
}

/* New strategy names, mistakes, emotions and expiries typed in a trade join the settings lists. */
async function ensureLists(t) {
  const c = cfg();
  let changed = false;
  if (t.strategy && !c.strategies.some(s => s.name === t.strategy)) { c.strategies.push({ id: uid('s'), name: t.strategy, description: '' }); changed = true; }
  for (const [k, vals] of [['mistakes', t.mistakes], ['emotions', t.emotions], ['expiries', t.expiry ? [t.expiry] : []]]) for (const v of vals) if (!c[k].includes(v)) { c[k].push(v); changed = true; }
  if (changed) await store().putSettings(c);
}

/* ---------- export / import ---------- */
async function downloadFile(name, data, type) {
  const blob = data instanceof Blob ? data : new Blob([data], { type });
  if (S.downloads) {
    try { await S.downloads.save({ filename: name, data: blob }); }
    catch (e) { if (!e || e.code !== 'declined') toast('Не вдалося зберегти файл: ' + errText(e), 'err'); }
    return;
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
async function exportJSON() {
  const d = D(), keys = new Map(), images = {};
  const trades = d.trades.map(t => ({ ...t, images: t.images.map(ref => { if (!keys.has(ref)) keys.set(ref, 'img' + keys.size); return keys.get(ref); }) }));
  let failed = 0, i = 0;
  for (const [ref, k] of keys) {
    i++;
    if (keys.size > 5 && i % 10 === 1) toast(`Пакую скріни ${i}/${keys.size}…`);
    try { const b = await getBlob(ref); if (b) images[k] = await blobToDataURL(b); else failed++; } catch { failed++; }
  }
  const payload = { app: 'edge-journal', version: 2, kind: 'binary', exportedAt: new Date().toISOString(), settings: d.settings, trades, images };
  await downloadFile(`edge-journal-${todayStr()}.json`, JSON.stringify(payload), 'application/json');
  if (failed) toast(`${failed} скрінів не вдалося додати в експорт`, 'err');
}
function exportCSV(trades) {
  const cols = [['Дата', t => t.date], ['Час', t => t.time], ['Актив', t => t.symbol], ['Напрям', t => DIR[t.direction][1]], ['Стратегія', t => t.strategy], ['Експірація', t => t.expiry],
    ['Ставка', t => t.stake], ['Виплата %', t => t.payout], ['Результат', t => RES[t.result]], ['Прибуток', t => tradeNet(t)],
    ['За планом', t => t.followedPlan == null ? '' : t.followedPlan ? 'так' : 'ні'], ['Помилки', t => t.mistakes.join(', ')], ['Емоції', t => t.emotions.join(', ')],
    ['Закриття', t => closeTime(t.time, t.expiry)], ['Рух, пунктів', t => signedPips(t)],
    ['Аналіз', t => t.analysis], ['Не за планом', t => t.offPlan], ['Скрінів', t => t.images.length]];
  const cell = v => { if (v == null) return ''; let s = typeof v === 'number' ? String(v).replace('.', ',') : String(v); if (/[";\n\r]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"'; return s; };
  const rows = [cols.map(c => c[0]).join(';'), ...sortChrono(trades).map(t => cols.map(c => cell(c[1](t))).join(';'))];
  downloadFile(`edge-journal-${todayStr()}.csv`, '﻿' + rows.join('\r\n'), 'text/csv');
}
async function importJSON(file, progress) {
  let j;
  try { j = JSON.parse(await file.text()); } catch { throw new Error('файл пошкоджений або це не JSON'); }
  if (!j || j.app !== 'edge-journal' || !Array.isArray(j.trades)) throw new Error('це не резервна копія Edge Journal');
  const st = store(), refMap = new Map();
  let n = 0;
  for (const raw of j.trades) {
    const t = normTrade(raw);
    const refs = [];
    for (const k of t.images) {
      if (!refMap.has(k)) {
        const du = j.images && j.images[k];
        if (typeof du !== 'string' || !du.startsWith('data:image/')) continue;
        refMap.set(k, await st.putImage(dataURLtoBlob(du)));
      }
      refs.push(refMap.get(k));
    }
    t.images = refs;
    if (S.demo) t.demo = true; else delete t.demo;
    await st.putTrade(t);
    upsertTrade(t);
    n++;
    progress(`Імпорт ${n}/${j.trades.length}…`);
  }
  const cur = cfg(), inc = normSettings(j.settings);
  const merged = normSettings({
    ...cur,
    currency: cur.startBalance || D().trades.length > n ? cur.currency : inc.currency,
    startBalance: cur.startBalance || inc.startBalance,
    strategies: [...cur.strategies, ...inc.strategies.filter(s => !cur.strategies.some(x => x.name === s.name))],
    mistakes: uniq([...cur.mistakes, ...inc.mistakes]), emotions: uniq([...cur.emotions, ...inc.emotions]), expiries: uniq([...cur.expiries, ...inc.expiries]),
  });
  await st.putSettings(merged);
  D().settings = merged;
  return n;
}

/* ---------- demo data ---------- */
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function demoShot(seed, dir, result, symbol, expiry) {
  const R = mulberry32(seed), W = 1200, H = 675;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.fillStyle = '#10141b'; g.fillRect(0, 0, W, H);
  g.strokeStyle = '#1b222c'; g.lineWidth = 1;
  for (let x = 0; x < W; x += 100) { g.beginPath(); g.moveTo(x + .5, 0); g.lineTo(x + .5, H); g.stroke(); }
  for (let yy = 0; yy < H; yy += 75) { g.beginPath(); g.moveTo(0, yy + .5); g.lineTo(W, yy + .5); g.stroke(); }
  const N = 80, entryI = 62, expI = 72, sgn = dir === 'up' ? 1 : -1, target = result === 'win' ? 2.4 : result === 'loss' ? -2.4 : 0;
  const bars = []; let p = 100, entryP = 0;
  for (let i = 0; i < N; i++) {
    const o = p;
    let mv;
    if (i <= entryI) mv = (R() - 0.5) * 1.6 + (i > entryI - 10 ? -sgn * 0.12 : 0);
    else if (i <= expI) mv = (entryP + sgn * target - p) * 0.22 + (R() - 0.5) * 0.9;
    else mv = (R() - 0.5) * 1.4;
    const cl = o + mv, hi = Math.max(o, cl) + R() * 0.7, lo = Math.min(o, cl) - R() * 0.7;
    bars.push([o, hi, lo, cl]); p = cl;
    if (i === entryI) entryP = cl;
  }

    g.beginPath(); g.moveTo(xc(i), y(h)); g.lineTo(xc(i), y(l)); g.stroke();
    g.fillRect(xc(i) - bw / 2 + 2, Math.min(y(o), y(cl)), bw - 4, Math.max(1, Math.abs(y(o) - y(cl))));
  });
  g.strokeStyle = '#d1d4dc'; g.setLineDash([6, 5]);
  g.beginPath(); g.moveTo(xc(entryI), y(entryP)); g.lineTo(xc(expI), y(entryP)); g.stroke();
  g.strokeStyle = '#f2a93b'; g.beginPath(); g.moveTo(xc(expI), 40); g.lineTo(xc(expI), H - 30); g.stroke(); g.setLineDash([]);
  g.fillStyle = sgn > 0 ? '#26a69a' : '#ef5350';
  g.beginPath();
  const ax = xc(entryI), ay = y(entryP) + (sgn > 0 ? 26 : -26);
  g.moveTo(ax, ay - sgn * 18); g.lineTo(ax - 10, ay); g.lineTo(ax + 10, ay); g.closePath(); g.fill();
  g.fillStyle = '#d1d4dc'; g.font = '600 22px system-ui, sans-serif'; g.fillText(`${symbol} · ${expiry}`, 24, 34);
  g.fillStyle = '#f2a93b'; g.font = '700 14px system-ui, sans-serif'; g.fillText('DEMO', W - 70, 30);
  return c.toDataURL('image/jpeg', 0.8);
}
const DEMO_SEED = 42;
function makeDemo() {
  const R = mulberry32(DEMO_SEED);
  const pick = a => a[Math.floor(R() * a.length)];
  const strategies = [
    { id: 's_demo1', name: 'Відбій від рівня', description: 'Ціна торкається сильного рівня і дає свічку відбою.\nВхід у бік відбою, експірація 1–3 хв.' },
    { id: 's_demo2', name: 'Пробій рівня', description: 'Свічка закривається за рівнем з імпульсом.\nВхід на наступній свічці, експірація 2–5 хв.' },
    { id: 's_demo3', name: 'RSI + Bollinger', description: 'Ціна за межею смуги Боллінджера, RSI вище 70 або нижче 30.\nВхід проти руху, експірація 1 хв.' },
    { id: 's_demo4', name: 'Новинний імпульс', description: 'Вхід у бік імпульсу після виходу новини.' },
  ];
  const prof = { 'Відбій від рівня': 0.66, 'Пробій рівня': 0.62, 'RSI + Bollinger': 0.59, 'Новинний імпульс': 0.47 };
  const exps = { 'Відбій від рівня': ['1 хв', '2 хв', '3 хв'], 'Пробій рівня': ['2 хв', '3 хв', '5 хв'], 'RSI + Bollinger': ['1 хв', '1 хв', '30 с'], 'Новинний імпульс': ['1 хв', '5 хв'] };
  const assets = ['EUR/USD', 'GBP/USD', 'EUR/USD OTC', 'AUD/CAD OTC', 'USD/JPY', 'EUR/JPY'];
  const why = {
    'Відбій від рівня': ['Третій дотик рівня, пін-бар на M1.', 'Сильний рівень підтримки, свічка поглинання.'],
    'Пробій рівня': ['Закриття свічки за рівнем з великим тілом.', 'Пробій максимуму сесії з імпульсом.'],
    'RSI + Bollinger': ['Ціна за верхньою смугою, RSI 78.', 'Вихід за нижню смугу, RSI 24, розворотна свічка.'],
    'Новинний імпульс': ['Сильна новина по USD, вхід у бік імпульсу.', 'Різкий рух після новини, увійшов на відкаті.'],
  };
  const offs = ['Увійшов раніше закриття свічки.', 'Після мінуса одразу поставив більше, щоб відігратись.', 'Взяв не ту експірацію, яку планував.', 'Увійшов без сигналу від нудьги.', 'Торгував під час новини, хоча план забороняє.'];
  const trades = [];
  // nine weeks from a Monday, so the random sequence (and the demo's story) is the same whatever today is
  const start = new Date(); start.setHours(12, 0, 0, 0);
  start.setDate(start.getDate() - ((start.getDay() + 6) % 7) - 56);
  for (let k = 0; k < 63; k++) {
    const day = new Date(start); day.setDate(start.getDate() + k);
    if (ymd(day) > todayStr()) break;
    const weekend = k % 7 >= 5;
    const cnt = weekend ? (R() < 0.6 ? 0 : 1 + Math.floor(R() * 3)) : (R() < 0.15 ? 0 : 2 + Math.floor(R() * 5));
    let prev = null, hour = 9 + Math.floor(R() * 6), min = Math.floor(R() * 50);
    for (let j = 0; j < cnt; j++) {
      const s = pick(strategies);
      const sym = weekend ? pick(['EUR/USD OTC', 'AUD/CAD OTC', 'GBP/USD OTC']) : pick(assets);
      const chasing = prev && prev.result === 'loss' && R() < 0.3;
      const followed = !chasing && R() > 0.18;
      const r = R(), p = chasing ? prof[s.name] - 0.3 : followed ? prof[s.name] : prof[s.name] - 0.25;
      const result = r < 0.03 ? 'draw' : r < 0.03 + p * 0.97 ? 'win' : 'loss';
      const stake = chasing ? (prev.stake || 10) * 2 : pick([10, 10, 10, 15, 20]);
      const payout = sym.includes('OTC') ? pick([80, 82, 85]) : pick([82, 85, 87, 88, 90, 92]);
      const mistakes = chasing ? ['Відіграш після мінуса', ...(R() < 0.4 ? ['Завелика ставка'] : [])] : !followed ? [pick(['Вхід без сигналу', 'Ранній вхід', 'Запізнений вхід', 'Не та експірація', 'Торгував на новинах', 'Проти тренду', 'Овертрейдинг'])] : [];
      min += 4 + Math.floor(R() * 20);
      if (min >= 60) { hour += Math.floor(min / 60); min %= 60; }
      if (hour > 22) break;
      const t = normTrade({
        id: uid('demo'), demo: true, date: ymd(day), time: `${pad(hour)}:${pad(min)}`,
        symbol: sym, direction: R() < 0.5 ? 'up' : 'down', result, stake, payout, expiry: pick(exps[s.name]), strategy: s.name,
        followedPlan: chasing ? false : followed, mistakes,
        emotions: [followed ? pick(['Спокій', 'Впевненість', 'Спокій']) : pick(['FOMO', 'Нетерпіння', 'Злість', 'Страх'])],
        analysis: pick(why[s.name]), offPlan: !followed ? (chasing ? offs[1] : pick(offs)) : '', createdAt: day.getTime() + j,
      });
      t.pnl = tradeNet(t);
      trades.push(t);
      prev = t;
    }
  }
  const P = mulberry32(DEMO_SEED + 7);
  for (const t of trades) t.pips = t.result === 'draw' ? null : Math.round((t.result === 'win' ? 0.4 + P() * 5 : P() < 0.3 ? 0.1 + P() * 0.9 : 1 + P() * 4.5) * 10) / 10;
  const recent = sortChrono(trades).reverse();
  recent.slice(0, 8).forEach((t, i) => { t.images = [demoShot(i + 11, t.direction, t.result, t.symbol, t.expiry)]; });
  return { trades, settings: normSettings({ ...defaultSettings(), strategies, startBalance: 1000, defaultStake: 10 }) };
}

/* ---------- theme ---------- */

/* ---------- global wiring ---------- */

  $('#btnSettings').innerHTML = I.gear;
  $('#btnNew').addEventListener('click', () => openTradeForm(null));
  $('#btnSettings').addEventListener('click', openSettings);

/* ---------- boot ---------- */
async function connectCloud() {
  const cl = window.claude;
  if (!cl || typeof cl.use !== 'function') return null;
  const [db, user, assets, downloads] = await Promise.all(['db', 'user', 'assets', 'downloads'].map(n => cl.use(n).catch(() => null)));
  S.downloads = downloads;
  if (!db || !user) return null;
  const id = await user.id().catch(() => null);
  if (!id) return null;
  const st = new CloudStore(db, assets, id);
  const data = await st.load();
  return { st, data };
}
function loginScreen() {
  return new Promise(resolve => {
    $('#filters').hidden = true;
    $('.top-actions').hidden = true;
    $('#storeChip').lastChild.textContent = 'Вхід';
    $('#view').innerHTML = `<form class="panel login" id="loginForm" novalidate>
      <h2>Вхід у журнал</h2>
      <p class="muted" style="margin:0">Журнал приватний. Введи пароль, який задав у налаштуваннях Worker на Cloudflare.</p>
      <label class="fld" for="lg-pass"><span>Пароль</span><input id="lg-pass" type="password" autocomplete="current-password" required></label>
      <div class="msg" id="lg-msg" role="alert"></div>
      <button class="btn primary" type="submit">Увійти</button>
    </form>`;
    const f = $('#loginForm'), msg = $('#lg-msg'), btn = $('button[type=submit]', f);
    $('#lg-pass').focus();
    f.addEventListener('submit', async e => {
      e.preventDefault();
      btn.disabled = true; msg.textContent = '';
      try { await apiCall('POST', '/api/login', { password: $('#lg-pass').value }); $('.top-actions').hidden = false; resolve(); }
      catch (err) { msg.textContent = errText(err); btn.disabled = false; }
    });
  });
}
function serverProblem(text) {
  $('#filters').hidden = true;
  $('#storeChip').className = 'store-chip warn';
  $('#storeChip').lastChild.textContent = 'Сервер';
  $('#view').innerHTML = `<section class="panel nores"><b>Журнал на сервері недоступний</b><span>${esc(text)}</span><button class="btn" type="button" id="btnRetry">Спробувати ще раз</button></section>`;
  $('#btnRetry').addEventListener('click', () => location.reload());
}
/* Served by the Worker: /api/me answers JSON (200 or 401). A plain file or another host does not. */
async function connectServer() {
  if (!/^https?:$/.test(location.protocol) || window.claude) return null;
  let r;
  try { r = await fetch('/api/me', { credentials: 'same-origin', headers: { accept: 'application/json' } }); } catch { return null; }
  if (!(r.headers.get('content-type') || '').includes('application/json')) return null;
  const d = await r.json().catch(() => ({}));
  if (r.status === 401) { await loginScreen(); return connectServer(); }
  if (!r.ok) return { problem: d.error || `Сервер відповів ${r.status}` };
  S.quotes = Boolean(d.quotes);
  const st = new ApiStore();
  return { st, data: await st.load() };
}
async function boot() {
  applyTheme(true);
  bindStatic();
  render();
  let loaded = null;
  try { const c = await connectCloud(); if (c) { S.store = c.st; loaded = c.data; } }
  catch (e) { console.warn('Cloud storage unavailable', e); toast('Хмарне сховище недоступне, працюю в цьому браузері', 'err'); }
  if (!S.store) {
    let sv = null;
    try { sv = await connectServer(); }
    catch (e) { serverProblem('Не вдалося завантажити угоди: ' + errText(e)); return; }
    if (sv && sv.problem) { serverProblem(sv.problem); return; }
    if (sv) { S.store = sv.st; loaded = sv.data; }
  }
  if (!S.store) {
    try { S.store = await LocalStore.open(); loaded = await S.store.load(); try { navigator.storage && navigator.storage.persist && navigator.storage.persist().catch(() => {}); } catch { /* not supported */ } }

  }
  S.data.trades = (loaded.trades || []).map(normTrade);
  S.data.settings = normSettings(loaded.settings);
  if (S.store.subscribe) {
    S.store.subscribe(
      list => { S.data.trades = list.map(normTrade); refreshSoon(); },
      s => { S.data.settings = normSettings(s); refreshSoon(); },
      e => toast('Синхронізацію зупинено: ' + errText(e), 'err'));
  }
  S.ready = true;
  readyResolve();
  render();
}
boot();
