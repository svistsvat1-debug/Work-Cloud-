# Edge Journal on Cloudflare Workers.
# D1 database and R2 bucket are created automatically on the first deploy; tables on the first request.
# No secrets are required: the password is created on the site at first visit, quotes come from Dukascopy.
# Optional secrets (Worker -> Settings -> Variables and Secrets):
#   JOURNAL_PASSWORD  - overrides the password created on the site
#   TWELVE_DATA_KEY   - fallback source of 1-minute candles if Dukascopy is unavailable
name = "edge-journal"
main = "src/worker.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "edge-journal"

[[r2_buckets]]
binding = "SHOTS"
bucket_name = "edge-journal-shots"

[observability]
enabled = true
