<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hushbreaker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="game-canvas" width="1920" height="1080"></canvas>

  <!--
    Scripts load in this exact order: a file can only use things defined above it
    when it runs. Each file defines one class or object.
    We use classic scripts (not ES modules), so the game runs by simply
    double-clicking index.html: no local server needed.
  -->

  <!-- Numbers that shape the game -->
  <script src="src/config/GameConfig.js"></script>
  <script src="src/config/PassiveDefinitions.js"></script>
  <script src="src/config/WeaponDefinitions.js"></script>
  <script src="src/config/WaveDefinitions.js"></script>
  <script src="src/config/EvolutionDefinitions.js"></script>
  <script src="src/config/ShopDefinitions.js"></script>

  <!-- Core helpers and engine pieces -->
  <script src="src/core/MathUtils.js"></script>
  <script src="src/core/ArrayUtils.js"></script>
  <script src="src/core/ObjectPool.js"></script>
  <script src="src/core/SpatialGrid.js"></script>
  <script src="src/core/SpriteCache.js"></script>
  <script src="src/core/DrawUtils.js"></script>
  <script src="src/core/Input.js"></script>
  <script src="src/core/Camera.js"></script>
  <script src="src/core/SaveData.js"></script>

  <!-- Sprites drawn with code (no image files) -->
  <script src="src/assets/ProceduralSprites.js"></script>
  <script src="src/assets/CharacterSprites.js"></script>
  <script src="src/assets/ImageSprites.js"></script>
  <script src="src/assets/WorldSprites.js"></script>

  <!-- Things that live in the world (Entity first: the others extend it) -->
  <script src="src/entities/Entity.js"></script>
  <script src="src/entities/Player.js"></script>
  <script src="src/entities/Enemy.js"></script>
  <script src="src/entities/Projectile.js"></script>
  <script src="src/entities/Pickup.js"></script>
  <script src="src/entities/XPGem.js"></script>
  <script src="src/entities/Chest.js"></script>
  <script src="src/entities/Coin.js"></script>

  <!-- Weapons (Weapon first: the others extend it) -->
  <script src="src/weapons/Weapon.js"></script>
  <script src="src/weapons/ProjectileWeapon.js"></script>
  <script src="src/weapons/OrbitWeapon.js"></script>
  <script src="src/weapons/PulseWeapon.js"></script>
  <script src="src/weapons/StrikeWeapon.js"></script>

  <!-- Menu screens -->
  <script src="src/ui/MenuBackground.js"></script>
  <script src="src/ui/StartScreen.js"></script>
  <script src="src/ui/ShopScreen.js"></script>
  <script src="src/ui/LevelUpMenu.js"></script>
  <script src="src/ui/ChestScreen.js"></script>
  <script src="src/ui/PauseScreen.js"></script>
  <script src="src/ui/GameOverScreen.js"></script>

  <!-- Systems: each one does one job every frame -->
  <script src="src/systems/Spawner.js"></script>
  <script src="src/systems/WaveDirector.js"></script>
  <script src="src/systems/CollisionSystem.js"></script>
  <script src="src/systems/WeaponSystem.js"></script>
  <script src="src/systems/UpgradeSystem.js"></script>
  <script src="src/systems/EffectsSystem.js"></script>
  <script src="src/systems/AudioSystem.js"></script>
  <script src="src/systems/WorldRenderer.js"></script>
  <script src="src/systems/Renderer.js"></script>
  <script src="src/systems/UISystem.js"></script>

  <!-- The game itself and the entry point -->
  <script src="src/core/Game.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
