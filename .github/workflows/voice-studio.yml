# Deploys Voice Studio (voice-studio/cloud) to Cloudflare Workers and sets its secrets.
# Needs three repository secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN  - Cloudflare token from the "Edit Cloudflare Workers" template
#   DEEPINFRA_API_KEY     - key from deepinfra.com
#   SITE_PASSWORD         - password for the site, 12+ characters
name: Deploy Voice Studio

on:
  push:
    branches: [voice-studio]
    paths: ["voice-studio/cloud/**", ".github/workflows/voice-studio.yml"]
  workflow_dispatch:

concurrency: voice-studio-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voice-studio/cloud
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
      SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
    steps:
      - name: Check secrets
        id: secrets
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN DEEPINFRA_API_KEY SITE_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::warning::Not deployed. Missing repository secrets:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Install wrangler
        if: steps.secrets.outputs.ready == 'true'
        run: npm ci

      - name: Deploy
        if: steps.secrets.outputs.ready == 'true'
        run: npx wrangler deploy

      - name: Set site secrets
        if: steps.secrets.outputs.ready == 'true'
        run: |
          printf '%s' "$DEEPINFRA_API_KEY" | npx wrangler secret put DEEPINFRA_API_KEY
          printf '%s' "$SITE_PASSWORD" | npx wrangler secret put SITE_PASSWORD

      - name: Check the site answers
        if: steps.secrets.outputs.ready == 'true'
        run: |
          sleep 15
          curl -fsS --retry 5 --retry-delay 5 https://voice-studio.svistsvat1.workers.dev/api/status
