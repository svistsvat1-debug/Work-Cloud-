# Voice lab: tries DeepInfra voices for each language and checks them with speech recognition.
# Runs on pushes to voice-studio/lab/** (what it does is in voice-studio/lab/run.sh). Costs cents of DeepInfra balance.
name: Voice lab

on:
  push:
    branches: [voice-studio]
    paths: ["voice-studio/lab/**", ".github/workflows/voice-lab.yml"]
  workflow_dispatch:

concurrency: voice-lab

permissions:
  contents: read
  actions: read

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: voice-studio/lab
    env:
      DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
      SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Earlier run to reuse
        id: reuse
        run: echo "run=$(cat reuse_run.txt 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        if: steps.reuse.outputs.run != ''
        with:
          name: voice-lab
          path: voice-studio/lab/out
          run-id: ${{ steps.reuse.outputs.run }}
          github-token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run
        run: bash run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-lab
          path: voice-studio/lab/out/
          if-no-files-found: ignore
          retention-days: 14
